apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: sakhisilai
  labels:
    app: sakhisilai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakhisilai-backend
  template:
    metadata:
      labels:
        app: sakhisilai-backend
    spec:
      containers:
        - name: backend
          image: arvi8080/sakhisilai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: sqlite-data-pvc
